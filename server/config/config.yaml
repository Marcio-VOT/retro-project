server:
  port: "8080"
  read_timeout: "15s"
  write_timeout: "15s"
  idle_timeout: "60s"

database:
  host: "localhost"
  port: "5432"
  user: "retro_user"
  password: "retro_password"
  dbname: "retro_db"
  sslmode: "disable"

jwt:
  secret: "your-super-secret-jwt-key-change-in-production"
  expiration: "24h"

cors:
  allowed_origins:
    - "http://localhost:3000"
    - "http://127.0.0.1:3000"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
  allowed_headers:
    - "*" 