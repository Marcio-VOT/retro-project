version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: retro-postgres
    environment:
      POSTGRES_DB: retro_db
      POSTGRES_USER: retro_user
      POSTGRES_PASSWORD: retro_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - retro-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retro_user -d retro_db"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: retro-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - retro-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: retro-backend
    ports:
      - "8080:8080"
    environment:
      - GIN_MODE=release
      - DATABASE_HOST=postgres
      - DATABASE_PORT=5432
      - DATABASE_USER=retro_user
      - DATABASE_PASSWORD=retro_password
      - DATABASE_DBNAME=retro_db
      - DATABASE_SSLMODE=disable
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - retro-network
    volumes:
      - ./config:/app/config
    restart: unless-stopped

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: retro-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@retro.com
      PGADMIN_DEFAULT_PASSWORD: admin
    ports:
      - "5050:80"
    depends_on:
      - postgres
    networks:
      - retro-network

volumes:
  postgres_data:
  redis_data:

networks:
  retro-network:
    driver: bridge 